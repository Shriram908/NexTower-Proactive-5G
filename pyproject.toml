[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextower"
version = "1.0.0"
description = "Reproducible geometry-aware handover research for connected vehicles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shriram Masalekar"}]
dependencies = ["PyYAML==6.0.3", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.1", "build==1.4.0"]

[project.scripts]
nextower = "nextower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
nextower = ["dashboard.html"]
